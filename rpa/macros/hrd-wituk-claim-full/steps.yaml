# HRD-Net 위탁 비용신청 v1(기본) — PPT「HRD-net 비용신청 프로세스_화면캡쳐(1019)」+「아직수동클릭해야하는부분」(1029) 반영
#
# action: focus | click | type | check | attach | wait | screenshot
#         search_company (관리번호 검색 → 업체명 확인 → 체크) | alert (알림창 글자 판정 후 [확인])
#         verify_errors (훈련인원 오류여부 Y 확인, 사람에게 묻지 않음) | verify_done (신청 완료 확인)
#         menu_search (우측 상단 메뉴검색으로 화면 이동) | click_round_row (실시회차가 맞는 '신청대상' 행의 [신청])
# target: 아래 순서로 찾는다. 못 찾으면 화면을 찍고 이 회차를 멈춘다(v2.2.3 — 사람에게 클릭을 넘기지 않는다. 학습 모드만 예외).
#   scope:   팝업 창 제목 — 같은 이름 버튼(비용등록·저장·닫기)이 여러 개라서 찾는 범위를 좁힌다
#   uia:     {title, control_type, auto_id, found_index}   ← run.bat inspect 결과를 보고 채운다
#   image:   templates/xxx.png (이 매크로 폴더 기준)        ← UIA 로 안 보이면 버튼을 캡처해 넣는다
#            [{image, offset: [dx, dy]}, …] 처럼 여러 개·기준 그림에서 떨어진 자리도 쓸 수 있다(앞에서부터 찾는다)
#   learned: template(기본) | coords | off                 ← 학습 녹화(learned_actions.json) 재생 방법
# 단계 옵션
#   required          사람 단계에서 [건너뛰기]를 못 하게
#   optional          첨부할 파일이 없으면 건너뜀
#   skip_if_missing   화면 요소를 못 찾으면 사람에게 묻지 않고 건너뜀(보조 단계)
#   unique            영역 안에서 딱 1곳일 때만 누른다(같은 모양 버튼이 여럿이면 누르지 않음)
#   wait              화면이 늦게 뜰 때 몇 초까지 다시 찾을지
#   scope_image       {image, box:[l,t,r,b]} 기준 그림(팝업 제목줄 등)을 찾고 그 자리 기준 영역 안에서만 찾는다(100% 배율 기준 거리)
#   expect (alert)    확인창이 안 보이면 멈춘다(저장이 안 된 채 넘어가지 않게)
#   only_if_older_than_days  {검색시작}이 이 일수보다 오래됐을 때만 한다(검색기간 — 기본값 최근 1년 밖일 때)
#   verify_amount     클릭 뒤 신청액 총액 == 산출액 총액 == 대시보드 금액 확인
#   on_skip           업체가 불가로 빠져도 이 단계는 한다(팝업 닫기)    only_on_skip  불가일 때만 한다
#   confirm           최종 신청 — 실제 신청 모드에서 사람이 [훈련비용 신청]을 눌러야 진행. 미리 채워 보기는 여기서 멈춤
#   after_round       회차가 끝난 뒤 검색화면(최초 입력 단계)으로 돌아가는 단계
#   first_round_only  검색화면으로 돌아온 다음 회차에서는 건너뛴다(메뉴 이동)
# 값 자리표시: {과정명} {회차} {검색시작} {검색종료} {사업장명} {사업장관리번호} {신청금액} {파일}
# ★ selector(uia/image) 는 가완성 — 담당자 PC 에서 [화면 진단]·[학습 미리채워 보기]로 채운다.

window: ".*(?:HRD.*행정지원|행정지원시스템|Edubion).*"     # 화면 이동에 따라 바뀌는 실제 프로그램 창 제목

steps:
  # v2.2.2~ — 회차 숫자는 점글꼴 표, 「신청대상」은 글자 그림으로 확인(윈도우 OCR 은 9 를 3 으로 읽음). 검색은 「훈련과정명 + 회차」. 1~3 단계는 사람에게 넘기지 않는다(못 하면 건너뛰거나 이유를 남기고 멈춘다).
  # HRD-Net 화면은 UIA·웹 구조로 보이지 않는다(10/29 화면 진단). 그래서 검색화면 칸은 늘 같은 모양인 기준 그림
  # templates/round_box_anchor.png(과정 선택 회색 칸 끝의 ▼, 화면에 하나뿐) 에서 떨어진 거리(offset)로 누른다.
  # 거리는 10/29 테스트 영상(창 1400×1030) 기준: 과정명 -250 · 회차 +37 · 시작일 -178/+51 · 종료일 -65/+51 · [검색] +623/+42
  - id: "1"
    say: "HRD-Net 첫 화면(공통업무 · 나의 할일)에서 시작 — 로그인은 사람이 미리 한다"
    action: focus
    first_round_only: true

  - id: "2"
    say: "우측 상단 메뉴검색에 「비용신청관리(위탁)」 입력 → 돋보기 → 비용신청관리(위탁) 화면"
    action: menu_search
    text: "비용신청관리(위탁)"
    icon: "templates/menu_search_icon.png"          # 메뉴검색 칸 오른쪽 돋보기
    box_offset: [-80, 0]                             # 돋보기에서 왼쪽 = 검색칸 글자 자리
    expect_image: "templates/round_box_anchor.png"   # 이 그림이 보이면 비용신청관리(위탁) 검색화면 (이미 열려 있으면 그대로 진행)
    first_round_only: true

  - id: "2-a"
    say: "훈련과정/회차 칸에 과정명 입력"
    action: type
    text: "{과정명}"
    target: {image: [{image: "templates/round_box_anchor.png", offset: [-250, 0]}], learned: "off"}

  - id: "2-r"
    say: "훈련과정/회차 오른쪽 작은 회차 칸에 {회차} 입력 (목록을 한 회차로 거른다)"
    action: type
    text: "{회차}"
    skip_if_missing: true                # 못 넣어도 3단계가 회차를 읽고 누르므로 잘못 누르지 않는다
    verify_crop: [-21, -9, 22, 9]        # 넣은 뒤 회차 칸을 다시 읽어 확인 (3단계 판정 근거)
    target: {image: [{image: "templates/round_box_anchor.png", offset: [37, 0]}], learned: "off"}

  - id: "2-b"
    say: "검색기간 입력 ({검색시작} ~ {검색종료}) — 1년보다 오래전에 시작한 과정만 (기본 검색기간이 최근 1년)"
    action: type
    text: "{검색시작}"
    then_text: "{검색종료}"
    only_if_older_than_days: 360
    skip_if_missing: true
    target: {image: [{image: "templates/round_box_anchor.png", offset: [-178, 51]}], learned: "off"}       # 시작일 칸
    then_target: {image: [{image: "templates/round_box_anchor.png", offset: [-65, 51]}], learned: "off"}  # 종료일 칸

  - id: "2-c"
    say: "[검색] 클릭"
    action: click
    target: {image: ["templates/learned/2-c_1.png", {image: "templates/round_box_anchor.png", offset: [623, 42]}]}

  - id: "3"
    say: "목록에서 실시회차 {회차} · 처리상태 '신청대상' 행의 [신청] 클릭 (같은 회차의 정상지급 행은 [회수]라 고르지 않는다)"
    action: click_round_row               # 회차가 맞는 행이 딱 하나일 때만 누른다. 아니면 멈춘다
    button: "templates/claim_button.png"  # [신청] 버튼 그림 — 신청대상 행에만 있다
    round_cell: [-475, -36, -420, 6]      # 버튼 가운데 기준 같은 행의 「실시회차」 칸 (점글꼴 숫자 표로 읽는다 — ocr.GLYPHS)
    status_cell: [-50, -44, 50, -10]      # 버튼 바로 위 「처리상태」 칸 — 「신청대상」인 행만 고른다
    status_image: "templates/status_target.png"   # 「신청대상」 글자 그림 (없으면 OCR)
    list_wait: 10                         # [검색] 뒤 목록·[신청] 버튼이 뜰 때까지 최대 몇 초 기다릴지

  # v2.2.3 — 4단계(참여 업체 목록·비용등록 팝업)도 사람에게 넘기지 않는다. 모든 그림은 10/30 담당자 화면에서 잘라 냈다.
  # 팝업은 제목줄 그림(scope_image)을 찾고, 그 자리에서 떨어진 영역(box) 안에서 '딱 1곳'(unique)일 때만 누른다.
  # 업체 행은 사업장관리번호를 점글꼴 숫자표로 읽어 같은 번호인 행만 체크한다(못 읽으면 고르지 않는다).
  - id: "4-x"
    for_each: 사업장
    steps:
      - id: "4"
        say: "참여업체별 비용신청 현황 → [비용등록] 클릭 (참여 업체 목록 팝업) — {사업장명}"
        action: click
        target: {image: "templates/btn_cost_register_main.png", unique: true, wait: 10, learned: "off"}
      - id: "4-1"
        say: "참여 업체 목록 — 사업장관리번호 {사업장관리번호} 행 체크 (사업장목록)"
        action: search_company
        popup: {scope_image: {image: "templates/popup_company_title.png", box: [-80, -30, 800, 780]}, image: "templates/popup_company_title.png", wait: 8}
        input: {scope_image: {image: "templates/popup_company_title.png", box: [-20, 385, 100, 415]}, image: [{image: "templates/lbl_bizno.png", offset: [111, 0]}], unique: true}
        search_button: {scope_image: {image: "templates/popup_company_title.png", box: [640, 375, 740, 425]}, image: "templates/btn_search_popup.png", unique: true}
        rows: {scope_image: {image: "templates/popup_company_title.png"}, col: [-45, 492, -20, 712], number: [343, -8, 443, 8]}
      - id: "4-2"
        say: "비용신청대상 사업장에서 {사업장명} 행 체크"
        action: check_company_row
        rows: {scope_image: {image: "templates/popup_company_title.png"}, col: [-20, 112, 5, 305], number: [560, -8, 720, 8]}
      - id: "4-3"
        say: "팝업 안의 [비용등록] 클릭"
        action: click
        target: {scope_image: {image: "templates/popup_company_title.png", box: [500, 45, 640, 90]}, image: "templates/btn_cost_register_popup.png", unique: true, learned: "off"}
      - id: "4-3m"
        say: "비용등록 팝업 최대화 (작게 열리면 신청액 칸이 잘림)"
        action: maximize
        target: {image: "templates/costreg_title.png", unique: true, scope: "비용등록", wait: 10, learned: "off"}
      - id: "4-4e"
        say: "훈련인원 현황 오류여부 확인 — 빨간 Y 가 있으면 이 업체만 신청불가 (묻지 않음, 체크 전에 본다)"
        action: verify_errors
        error_header: "templates/hdr_error.png"
        row_header: "templates/hdr_seq_name.png"
        wait: 8
      - id: "4-4"
        say: "훈련인원 현황 헤더 전체 체크"
        action: check
        target: {scope_image: {image: "templates/hdr_seq_name.png", box: [-80, -12, -50, 12]}, image: ["templates/checkbox_empty.png", "templates/checkbox_checked.png"], unique: true, wait: 10, learned: "off"}
      - id: "4-5"
        say: "[산출액→신청액] 클릭 → 신청액 총액 = 산출액 총액 확인 ({신청금액}원)"
        action: click
        verify_amount: true
        computed_label: "templates/lbl_calc_total.png"
        applied_label: "templates/lbl_apply_total.png"
        target: {image: "templates/btn_calc_to_apply.png", unique: true, scope: "비용등록", learned: "off"}
      - id: "4-6"
        say: "비용등록 팝업 [저장] 클릭"
        action: click
        target: {scope_image: {image: "templates/costreg_title.png", box: [-60, 25, 1950, 70]}, image: "templates/btn_save_costreg.png", unique: true, learned: "off"}
      - id: "4-6a"
        say: "저장 확인창 [확인] → '저장되었습니다' 알림 [확인]"
        action: alert
        expect: true
        seconds: 6
      - id: "4-s"
        say: "비용등록 팝업 [닫기] (열려 있으면)"
        action: click
        on_skip: true
        skip_if_missing: true
        target: {scope_image: {image: "templates/costreg_title.png", box: [-60, 25, 1950, 70]}, image: "templates/btn_close_costreg.png", unique: true, wait: 2, learned: "off"}
      - id: "4-7"
        say: "참여 업체 목록 [닫기] → 비용신청관리 상세(위탁)로 돌아옴"
        action: click
        on_skip: true
        target: {scope_image: {image: "templates/popup_company_title.png", box: [650, 15, 740, 50]}, image: "templates/btn_popup_close.png", unique: true, wait: 3, learned: "off"}

  - id: "5-a"
    for_each: 전자계산서목록
    steps:
      - id: "5-1"
        say: "첨부파일 목록 — 훈련비 증명서류 [첨부] → {사업장명} 전자계산서"
        action: attach
        file: "{파일}"
        target: {uia: {}, image: "templates/learned/5-1_1.png"}

  - id: "5-b"
    for_each: 수납확인서목록
    steps:
      - id: "5-2"
        say: "첨부파일 목록 — 숙박비 관련 증명서류 [첨부] → {사업장명} 수납확인서"
        action: attach
        file: "{파일}"
        target: {uia: {}, image: "templates/learned/5-2_1.png"}

  - id: "6"
    say: "[저장] 클릭"
    action: click
    target: {image: ["templates/btn_save_main.png", "templates/learned/6_1.png"], unique: true, learned: "off"}

  - id: "6a"
    say: "저장 확인창 [확인] (저장하시겠습니까? → 저장되었습니다)"
    action: alert
    expect: true
    seconds: 6

  - id: "7"
    say: "[고용보험확인] 클릭 — 보험료 체납 경고가 뜨면 신청불가로 기록"
    action: click
    target: {image: ["templates/btn_insurance_check.png", "templates/learned/7_2.png"], unique: true, learned: "off"}

  - id: "7a"
    say: "고용보험확인 알림 [확인]"
    action: alert

  - id: "7-s"
    say: "신청 직전 화면 저장"
    action: screenshot

  - id: "8"
    say: "[훈련비용 신청] 클릭 — 최종 신청"
    action: click
    confirm: true
    target: {image: "templates/btn_apply_final.png", unique: true, learned: "off"}

  - id: "8a"
    say: "신청 확인창·알림 [확인]"
    action: alert
    expect: true
    seconds: 8

  - id: "8-s"
    say: "신청 후 화면 저장"
    action: screenshot

  - id: "9"
    say: "신청 완료 확인 — 상단 버튼이 [회수] [신청서 출력]만 남았는지"
    action: verify_done
    target: {uia: {title: "회수", control_type: "Button"}, image: ""}

  - id: "10"
    say: "우측 상단 메뉴검색으로 비용신청관리(위탁) 검색화면에 돌아가 다음 회차"
    action: menu_search
    after_round: true
    text: "비용신청관리(위탁)"
    icon: "templates/menu_search_icon.png"
    box_offset: [-80, 0]
    expect_image: "templates/round_box_anchor.png"
